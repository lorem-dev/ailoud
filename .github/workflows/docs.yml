# Docs: build the versioned documentation site with mike (Material for MkDocs)
# and publish it to the `gh-pages` branch, which GitHub Pages serves.
#
# One-time repository setup (Settings -> Pages):
#   Source: "Deploy from a branch" -> branch `gh-pages`, folder `/ (root)`.
#
# mike needs a branch it owns: it keeps one built site per version there and
# maintains the `versions.json` that the header switcher reads. Neither
# survives a model where every deploy replaces one whole artifact, which is why
# this is not an `upload-pages-artifact` + `deploy-pages` pair.
#
# Versioning -- RELEASE TAGS ONLY:
#   - A final release tag (`v1.2.3`) publishes that release under its bare
#     version number and moves the `latest` alias, which the site root
#     redirects to.
#   - A PRE-RELEASE tag (`v1.2.3-rc.1`, or any tag with a `-` qualifier)
#     publishes nothing. Release candidates exist to exercise the release
#     pipeline; their documentation is in progress, and publishing it only adds
#     throwaway entries to the switcher that someone then deletes by hand.
#   - A push to a branch publishes NOTHING. The site shows released
#     documentation only, so what is online always describes a version someone
#     can actually install.
#   - `workflow_dispatch` re-runs whatever ref it is pointed at, and refuses a
#     pre-release the same way the tag filter does.
#
# Documentation breakage is caught before it gets here: ci.yml runs the strict
# build on every push and pull request.

name: Docs

on:
  # After a successful publish, not beside it. On the tag push both workflows
  # started at once, so a publish that then refused -- or failed halfway
  # through its three packages -- left the site advertising a version npm did
  # not have. `workflow_run` waits for the answer.
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

# mike pushes commits to the gh-pages branch.
permissions:
  contents: write

# Serialize deploys so two runs never race on pushing gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy versioned docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A publish that failed publishes no documentation. Whether the commit is a
    # final release is decided in the job, from the manifest in the commit
    # itself -- `head_branch` on a workflow_run is documented as a branch, and
    # a release must not rest on what it happens to hold for a tag.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout the commit that was published
        uses: actions/checkout@v7
        with:
          # The SHA, which is unambiguous. Without a ref this would check out
          # the default branch, which is not necessarily what was published.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # mike needs full history plus the gh-pages branch it maintains.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Configure git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make the gh-pages branch available to mike
        run: git fetch origin gh-pages --depth=1 || true

      - name: Deploy release docs
        run: |
          set -euo pipefail

          # The version of the thing that was published, from the commit that
          # was published. publish.yml refuses a tag that disagrees with any
          # manifest, so this and the tag are the same number by then.
          version="$(node -p "require('./package.json').version")"
          # publish.yml runs for pre-release tags too, so this workflow starts
          # for them and stops here. A pre-release must not move the site: the
          # docs describe what `npm install ailoud` gives you.
          case "${version}" in
            *-*)
              echo "${version} is a pre-release; skipping docs publication."
              exit 0
              ;;
          esac

          echo "Publishing release docs ${version} (alias: latest)"
          uv run --with-requirements docs/requirements.txt \
            mike deploy --push --update-aliases "${version}" latest
          uv run --with-requirements docs/requirements.txt \
            mike set-default --push latest
