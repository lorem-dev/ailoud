# CI: the project-references build, a Prettier format check, ESLint,
# typecheck, and coverage-gated tests for the pnpm workspace, in that order
# (build first: cross-package types resolve through dist). Runs on every
# push to main/develop and on all pull requests.
#
# The end-to-end suite is split by what a spec needs from the machine:
#
#   - `e2e` runs the specs that need no external tools -- `mcp install`,
#     `uninstall` and `update`, which only read and write configuration. On
#     every push and pull request, because it costs seconds.
#   - `e2e-tools` provisions ffmpeg, whisper.cpp and a 488 MB model with
#     `ailoud setup`, then runs the whole suite. On pushes only: paying that
#     download on every pull request would not be worth the wall clock, and
#     the models are cached between runs so the usual cost is the install, not
#     the download.
#
# Specs in the second group fail loudly rather than skipping when a tool is
# missing. A suite that goes green by not running is worse than one that is
# honestly red.

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

# One run per branch (or per pull request), and only the newest of them.
# Keyed on the pull request when there is one, so the pull-request run and
# the push run of the same branch stay separate (their github.ref differs
# anyway) and each cancels only its own predecessor.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, format check, lint, typecheck, test
    runs-on: ubuntu-latest
    # This gate takes well under a minute today; anything near this bound
    # is stuck, and failing then beats holding a runner for the six-hour
    # default.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Set up Node.js 24 with pnpm cache
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install ffmpeg
        # packages/providers/src/audio/ffmpeg.test.ts spawns the real binary to
        # build its fixture and then drives FfmpegAudioTool over it. Installing
        # the tool rather than skipping the test: a suite that goes green by
        # not running is worse than one that is honestly red, and this is the
        # adapter whose whole job is talking to ffmpeg.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        # Cross-package types resolve through dist, so nothing can typecheck
        # before it exists.
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test with coverage (90% gate, packages/core)
        # vitest run --coverage enforces the thresholds defined in
        # vitest.config.ts.
        run: pnpm test:cov

  e2e:
    name: End-to-end (no external tools)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Set up Node.js 24 with pnpm cache
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: End-to-end specs that need no ffmpeg, whisper or model
        # These drive the built binary in a sandboxed HOME and a sandboxed
        # working directory. The sandboxed cwd is load-bearing: `mcp install
        # --location local` writes into the current directory, and without it
        # the child would edit this repository's own files.
        run: pnpm test:e2e:no-tools

  e2e-tools:
    name: End-to-end (provisioned)
    runs-on: ubuntu-latest
    # Not on pull requests: it downloads a 488 MB model on a cache miss.
    if: github.event_name == 'push'
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The audio fixtures are LFS-tracked; without this the suite
          # transcribes pointer files.
          lfs: true

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Set up Node.js 24 with pnpm cache
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cache the whisper models
        # Keyed on the catalogue, which holds the pinned file names, sizes and
        # URLs: a model change invalidates the cache, and nothing else does.
        uses: actions/cache@v4
        with:
          path: ~/.local/share/ailoud/models
          key: ailoud-models-${{ runner.os }}-${{ hashFiles('packages/core/src/provision/catalogue.ts') }}

      - name: Build
        run: pnpm build

      - name: Install ffmpeg
        # Installed with apt rather than left to `setup`, which correctly
        # refuses to run `sudo apt-get` with no terminal to answer a password
        # prompt on -- it reports the exact command instead of hanging. There
        # is no terminal on a runner, so the sudo step is ours to do.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Provision whisper.cpp and the models
        # Everything that needs no sudo: the whisper release and the model
        # files. Still the command a user runs, so this remains a test of
        # `setup` and not only a prerequisite for the suite. --llm skip because
        # no spec here summarises, and it would otherwise fetch another 2.1 GB.
        run: node apps/cli/dist/bin/ailoud.js setup --yes --llm skip

      - name: Report what the machine now has
        # Printed whether or not the suite passes: a red e2e run is far quicker
        # to read next to doctor's account of what was actually installed.
        if: always()
        run: node apps/cli/dist/bin/ailoud.js doctor || true

      - name: End-to-end suite
        run: pnpm test:e2e

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the documentation
        # --strict turns a broken internal link or an unknown nav entry into a
        # failure. Run here, on every push and pull request, so documentation
        # breakage surfaces now rather than at the release tag -- where the
        # docs workflow is the only thing that would have caught it, after the
        # tag already exists.
        run: uv run --with-requirements docs/requirements.txt mkdocs build --strict
