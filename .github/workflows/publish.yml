# Publish to npm from a release tag, with no long-lived credential.
#
# HOW THIS AVOIDS AN ACCESS TOKEN
#
# npm trusted publishing: GitHub mints a short-lived OIDC token for this
# workflow run, npm exchanges it for a publish credential valid for minutes,
# and provenance is attached automatically. Nothing long-lived is stored, so
# there is no 90-day expiry to remember and no secret to leak.
#
# ONE-TIME SETUP ON NPMJS.COM, per package (ailoud, and each scoped package):
#   Package -> Settings -> Trusted publisher -> GitHub Actions
#     Organization or user: lorem-dev
#     Repository:           ailoud
#     Workflow filename:    publish.yml
#     Environment:          (leave empty, this workflow declares none)
#
# A package that has never been published may need one classic token for the
# very first publish, after which the trusted publisher takes over -- check
# npm's current documentation when you get there, because that detail has been
# changing.
#
# WHY pnpm pack THEN npm publish, and not `pnpm publish`
#
# Each tool has exactly half of what is needed. `pnpm publish` rewrites the
# `workspace:*` dependencies into real versions, which npm requires and npm's
# own tooling will not do; it has no OIDC or provenance support. `npm publish`
# has both but leaves `workspace:*` in the manifest, which is not installable.
# So pnpm packs the tarball (rewriting the manifest and honouring `files`) and
# npm publishes that tarball.

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, e.g. v1.2.3'
        required: true

# id-token is what makes trusted publishing work; without it npm has no OIDC
# token to exchange and falls back to asking for a credential that is not there.
permissions:
  # contents: write is for the `retire` job below, which deletes the tags a
  # final release supersedes. A job calling a reusable workflow cannot be
  # granted more than the caller holds, so it is declared here rather than
  # only in retire.yml -- publishing itself reads and nothing more.
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The tag being released, resolved once. `github.ref_name` is the tag on
      # a tag push but the BRANCH on a workflow_dispatch, so a step that let it
      # default -- the changelog check did -- looked for a "## Version main"
      # section and failed a re-run of a perfectly good tag.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          lfs: true

      - name: Set up Node.js 24 and pnpm
        # Deliberately WITHOUT setup-node's registry-url. Given one, it writes
        # an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`; with no token
        # secret to fill it, npm still saw credentials, sent an empty one, and
        # never attempted the OIDC exchange -- the registry answered 404 on the
        # PUT and the log said nothing about trusted publishing at all. With no
        # .npmrc, npm finds it has no credentials and does the exchange. The
        # default registry is registry.npmjs.org either way.
        uses: ./.github/actions/setup-node-pnpm

      - name: Require an npm that can do trusted publishing
        # Trusted publishing landed in npm 11.5.1. An older npm fails by asking
        # for a token that this workflow deliberately does not have, and the
        # error does not say why -- so check it here and say so.
        run: |
          set -euo pipefail
          have=$(npm --version)
          need=11.5.1
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "::error::npm $have cannot do trusted publishing; $need or newer is required."
            exit 1
          fi
          echo "npm $have"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check the changelog is fit to release
        # First, and before the gate: a version number can never be reused and
        # the unpublish window is 72 hours, so every reason to refuse should be
        # found while refusing is still free. This checks the section exists and
        # has entries, that it is inside the hard limit, that nothing is
        # stranded under Development, and -- for a final tag -- that its
        # pre-release sections were folded.
        #
        # The scripts' own tests run in ci.yml, on branches and pull requests
        # rather than on tags, so a broken script is caught before a release
        # depends on it.
        run: node scripts/check-changelog.mjs "$TAG"

      - name: Check that the tag matches the version in the manifests
        # A tag that disagrees with package.json publishes a version nobody
        # asked for, under a tag that points at different code.
        run: |
          set -euo pipefail
          tag="$TAG"
          want="${tag#v}"
          for manifest in packages/core packages/providers apps/cli; do
            have=$(node -p "require('./$manifest/package.json').version")
            if [ "$have" != "$want" ]; then
              echo "::error::$manifest is at $have but the tag says $want. Run the bump-version skill."
              exit 1
            fi
          done
          echo "all three manifests are at $want"

      - name: Install ffmpeg
        # The gate includes packages/providers/src/audio/ffmpeg.test.ts, which
        # spawns the real binary. CI installs it for the same reason; this job
        # runs the same gate, so it needs the same tool. Without it the release
        # failed here rather than on anything about the release.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run the gate
        # Nothing is published that has not built, linted, typechecked and
        # passed its tests on this runner. An unpublish window is 72 hours and
        # a version number can never be reused.
        run: |
          pnpm build
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test:cov

      - name: End-to-end specs that need no external tools
        run: pnpm test:e2e:no-tools

      - name: Pack the three packages
        # pnpm rewrites the workspace protocol and applies each `files` list.
        run: |
          set -euo pipefail
          mkdir -p dist-npm
          for pkg in packages/core packages/providers apps/cli; do
            (cd "$pkg" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-npm")
          done
          ls -l dist-npm

      - name: Check each tarball carries the licence and no source
        # pnpm copies the repository's LICENSE into every workspace tarball,
        # which is why no package directory holds its own copy -- three copies
        # of a 224-line file would drift. That makes it an invariant worth
        # checking rather than assuming: if pnpm ever stops, this fails the
        # release instead of publishing an unlicensed package.
        #
        # The same step guards the other packing mistake: shipping `src` and
        # the tests. Before `files` was set, the CLI tarball carried 82 source
        # files and 32 test files.
        run: |
          set -euo pipefail
          for tarball in dist-npm/*.tgz; do
            echo "--- $tarball"
            contents=$(tar -tzf "$tarball")
            if ! grep -qiE '^package/LICEN[SC]E' <<< "$contents"; then
              echo "::error::$tarball has no LICENSE."
              exit 1
            fi
            if grep -qE '^package/src/' <<< "$contents"; then
              echo "::error::$tarball ships src/; check the \`files\` field."
              exit 1
            fi
            if grep -qE '\.test\.' <<< "$contents"; then
              echo "::error::$tarball ships tests; check the \`files\` field."
              exit 1
            fi
            # 1.0.0-dev.1 went out with no README, so all three npm pages read
            # "This package does not have a README" -- the first thing anyone
            # arriving from a search sees. The libraries hold their own; the
            # CLI's is the repository's, copied in by its prepack script, which
            # is the part that could silently stop working.
            if ! grep -qiE '^package/README' <<< "$contents"; then
              echo "::error::$tarball has no README."
              exit 1
            fi
            echo "licence, readme, no source, no tests"
          done

      - name: Publish, dependencies first
        # Order matters: the CLI's manifest names exact versions of the two
        # libraries, so they have to exist first. --provenance records which
        # workflow and which commit produced each tarball, verifiable from the
        # package page -- it works under either credential below.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          tag="$TAG"
          version="${tag#v}"
          # BOOTSTRAP ONLY. Trusted publishing is configured per package on
          # npmjs.com, which cannot be done for a package that does not exist
          # yet -- so the first version of each of the three has to go out on a
          # token, and npm answers ENEEDAUTH without one however complete the
          # OIDC setup is. Once the trusted publisher is attached to all three
          # package pages, delete the NPM_TOKEN secret: with it gone this
          # branch is skipped and npm does the OIDC exchange instead, which is
          # the arrangement with nothing to expire.
          if [ -n "${NPM_TOKEN:-}" ]; then
            # A final release may not go out on a token. The bootstrap is over
            # the moment the packages exist, and a token that keeps working is
            # a token nobody gets round to removing -- so the rule is enforced
            # here rather than remembered: snapshots may use it and say so, a
            # release refuses and names the two steps that clear it.
            case "$version" in
              *-*) echo "::warning::published with the NPM_TOKEN secret; attach the trusted publisher and delete the secret" ;;
              *)
                echo "::error::$version is a final release and NPM_TOKEN is set."
                echo "::error::Attach the trusted publisher on all three package pages"
                echo "::error::(organization lorem-dev, repository ailoud, workflow publish.yml,"
                echo "::error::environment empty), then delete the NPM_TOKEN secret and re-run."
                exit 1
                ;;
            esac
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          else
            echo "no NPM_TOKEN secret; publishing through trusted publishing"
          fi
          # Three kinds of tag, three destinations. See the dev-tag skill.
          #   -dev.N  a snapshot to try            -> dev
          #   -rc.N   what the release will be     -> next
          #   final   the release                  -> latest
          # Only the last moves `latest`, so `npm install ailoud` never picks up
          # a pre-release by accident -- with one exception nothing here can
          # prevent: npm sets `latest` on a package's first publish whatever
          # --tag says, and `latest` can be moved but never removed.
          case "$version" in
            *-dev.*) dist_tag=dev ;;
            *-*)     dist_tag=next ;;
            *)       dist_tag=latest ;;
          esac
          echo "publishing $version under dist-tag $dist_tag"
          for name in ailoud-core ailoud-providers ailoud; do
            # An ABSOLUTE path. Given `dist-npm/ailoud-core-1.0.0-dev.1.tgz`,
            # npm read the slash as the `owner/repo` GitHub shorthand and tried
            # to `git ls-remote ssh://git@github.com/dist-npm/...git`, which
            # failed on a missing public key rather than on anything to do with
            # publishing.
            tarball="$PWD/dist-npm/${name}-${version}.tgz"
            if [ ! -f "$tarball" ]; then
              echo "::error::$tarball was not packed."
              exit 1
            fi
            echo "--- $tarball"
            npm publish "$tarball" --provenance --access public --tag "$dist_tag"
          done

      - name: Report what was published
        if: always()
        run: ls -l dist-npm || true

  retire:
    # Final releases only. A pre-release supersedes nothing.
    name: Retire superseded pre-releases
    needs: publish
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    uses: ./.github/workflows/retire.yml
    with:
      version: ${{ github.event.inputs.tag || github.ref_name }}
