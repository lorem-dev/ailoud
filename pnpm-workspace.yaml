packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  unrs-resolver: true

# Moved here from .npmrc: it is a pnpm setting, and npm warned about it on
# every invocation that read .npmrc. See the note there.
#
# False rather than true because typescript is pinned to 6.0.3 in the root
# package.json, not the newer 7.0.2: typescript-eslint@8.67.0 declares the peer
# range ">=4.8.4 <6.1.0". Re-check that range with `pnpm peers check` before
# bumping either typescript or typescript-eslint.
strictPeerDependencies: false
